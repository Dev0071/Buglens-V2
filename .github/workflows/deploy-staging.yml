# Deploy to Heroku Staging
# Triggers on push to staging branch

name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  # ============================================
  # Run Tests First
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buglens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r python/requirements.txt

      - name: Run migrations
        run: npm run migrate:up
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test

      - name: Run tests
        run: npm test -- --run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # ============================================
  # Deploy API to Staging
  # ============================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: test
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_STAGING_API }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          buildpack: https://github.com/heroku/heroku-buildpack-nodejs

      - name: Health Check
        run: |
          echo "Waiting for deployment..."
          sleep 30

          API_URL="https://${{ secrets.HEROKU_APP_STAGING_API }}.herokuapp.com"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || echo "000")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check failed: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ API health check passed"

  # ============================================
  # Deploy Worker to Staging
  # ============================================
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: test
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_STAGING_WORKER }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          buildpack: https://github.com/heroku/heroku-buildpack-nodejs

      - name: Verify Worker
        run: |
          echo "Worker deployment complete"
          # Worker health is monitored via Heroku metrics

  # ============================================
  # Smoke Tests
  # ============================================
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-worker]

    steps:
      - name: Run Smoke Tests
        run: |
          API_URL="https://${{ secrets.HEROKU_APP_STAGING_API }}.herokuapp.com"

          # Test health endpoint
          echo "Testing health endpoint..."
          HEALTH=$(curl -s "$API_URL/health")
          echo "Health response: $HEALTH"

          # Verify database connection
          DB_STATUS=$(echo $HEALTH | jq -r '.database // "unknown"')
          if [ "$DB_STATUS" != "connected" ]; then
            echo "⚠️ Database status: $DB_STATUS"
          else
            echo "✅ Database connected"
          fi

          # Verify Redis connection
          REDIS_STATUS=$(echo $HEALTH | jq -r '.redis // "unknown"')
          if [ "$REDIS_STATUS" != "connected" ]; then
            echo "⚠️ Redis status: $REDIS_STATUS"
          else
            echo "✅ Redis connected"
          fi

  # ============================================
  # Notify on Completion
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: smoke-test
    if: always()

    steps:
      - name: Slack Notification
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.smoke-test.result }}
          channel: "#deployments"
          fields: repo,commit,author,action,workflow
          mention: "here"
          if_mention: failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
