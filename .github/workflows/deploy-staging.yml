name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  API_BASE_URL: "https://buglens-staging-api.ondigitalocean.app"
  FRONTEND_URL: "https://staging.buglens.co"

jobs:
  # ============================================
  # Run Tests
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buglens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r python/requirements.txt

      - name: Run migrations (CI)
        run: npm run migrate:up
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test

      - name: Run tests
        run: npm test -- --run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # ============================================
  # Deploy to DigitalOcean App Platform
  # ============================================
  deploy:
    name: Deploy to DigitalOcean (Staging)
    runs-on: ubuntu-latest
    needs: test
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # First-time setup: create the app from the spec.
      # After that, this step is skipped and the update step takes over.
      - name: Create app if it doesn't exist
        run: |
          if ! doctl apps list --format "Spec.Name" --no-header | grep -q "^buglens-staging$"; then
            echo "Creating staging app..."
            doctl apps create --spec .do/app.yaml --wait
          else
            echo "App already exists, skipping create."
          fi

      - name: Get app ID
        id: app
        run: |
          APP_ID=$(doctl apps list --format "ID,Spec.Name" --no-header | grep "buglens-staging" | awk '{print $1}')
          echo "id=$APP_ID" >> $GITHUB_OUTPUT

      - name: Deploy latest spec
        run: doctl apps update ${{ steps.app.outputs.id }} --spec .do/app.yaml --wait

      - name: Health check
        run: |
          echo "Checking $API_BASE_URL/api/v1/health"
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 10 --retry-all-errors \
            "$API_BASE_URL/api/v1/health"

      - name: Assert health payload
        run: |
          HEALTH=$(curl -s "$API_BASE_URL/api/v1/health")
          echo "Health: $HEALTH"

          DB=$(echo "$HEALTH" | jq -r '.database // "unknown"')
          REDIS=$(echo "$HEALTH" | jq -r '.redis // "unknown"')

          [ "$DB" = "connected" ] || { echo "❌ DB: $DB"; exit 1; }
          [ "$REDIS" = "connected" ] || { echo "❌ Redis: $REDIS"; exit 1; }
          echo "✅ DB + Redis healthy"

  # ============================================
  # Deploy Frontend to Vercel
  # ============================================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: deploy
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./web

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./web
        env:
          VITE_API_URL: ${{ env.API_BASE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed: $URL"
        working-directory: ./web

      - name: Alias staging domain
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" "staging.buglens.co" \
            --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}"
        working-directory: ./web

  # ============================================
  # Summary
  # ============================================
  notify:
    name: Summary
    runs-on: ubuntu-latest
    needs: [deploy, deploy-frontend]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Print summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Staging Deployment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Commit:  ${{ github.sha }}"
          echo "Actor:   ${{ github.actor }}"
          echo "API:     ${{ env.API_BASE_URL }}"
          echo "Status:  ${{ needs.deploy.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Slack notification
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result }}
          channel: "#deployments"
          fields: repo,commit,author,workflow
          text: |
            Staging deploy: ${{ needs.deploy.result }}
            API: ${{ env.API_BASE_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
