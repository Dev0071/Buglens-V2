name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  # Prefer your real domains (no more herokuapp.com in CI)
  API_BASE_URL: "https://api.staging.buglens.co"
  FRONTEND_URL: "https://staging.buglens.co"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buglens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r python/requirements.txt

      - name: Run migrations (CI)
        run: npm run migrate:up
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test

      - name: Run tests
        run: npm test -- --run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  build-info:
    name: Generate Build Info
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - name: Generate Version
        id: version
        run: |
          VERSION="staging-$(date +%Y%m%d-%H%M%S)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Short SHA
        id: sha
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Heroku (Staging)
    runs-on: ubuntu-latest
    needs: [test, build-info]
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_STAGING }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          buildpack: https://github.com/heroku/heroku-buildpack-nodejs
        env:
          # Optional: lets you see release/version in logs if your app reads them
          BUGLENS_DEPLOY_VERSION: ${{ needs.build-info.outputs.version }}
          BUGLENS_DEPLOY_SHA: ${{ github.sha }}

      - name: Wait for app to be ready + health check
        run: |
          set -euo pipefail
          echo "Checking: $API_BASE_URL/health"

          curl --fail --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "$API_BASE_URL/health" > /tmp/health.json

          echo "Health:"
          cat /tmp/health.json

      - name: Assert dependencies in health payload
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

          DB_STATUS=$(jq -r '.database // "unknown"' /tmp/health.json)
          REDIS_STATUS=$(jq -r '.redis // "unknown"' /tmp/health.json)

          if [ "$DB_STATUS" != "connected" ]; then
            echo "❌ Database status: $DB_STATUS"
            exit 1
          fi

          if [ "$REDIS_STATUS" != "connected" ]; then
            echo "❌ Redis status: $REDIS_STATUS"
            exit 1
          fi

          echo "✅ DB + Redis healthy"

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [deploy, build-info]
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment (staging)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./web

      - name: Build Frontend
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./web
        env:
          VITE_API_URL: ${{ env.API_BASE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed: $DEPLOYMENT_URL"
        working-directory: ./web

      - name: Alias staging domain
        run: |
          vercel alias set "${{ steps.deploy.outputs.deployment_url }}" "staging.buglens.co" \
            --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}"
        working-directory: ./web

      - name: Frontend health check
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "$FRONTEND_URL" > /dev/null
          echo "✅ Frontend is reachable: $FRONTEND_URL"

  smoke-test:
    name: Smoke Tests (API + Worker)
    runs-on: ubuntu-latest
    needs: [deploy, deploy-frontend]

    steps:
      - name: Basic endpoint checks
        run: |
          set -euo pipefail
          echo "🧪 /health"
          curl --fail --silent "$API_BASE_URL/health" > /dev/null

          echo "🧪 Auth endpoint exists"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API_BASE_URL/api/auth/login" || echo "000")
          if [ "$HTTP_CODE" = "404" ]; then
            echo "❌ /api/auth/login not found"
            exit 1
          fi
          echo "✅ Auth endpoint reachable (HTTP $HTTP_CODE)"

      - name: Worker liveness (you should implement this)
        run: |
          echo "⚠️ Worker liveness is not truly verified yet."
          echo "Implement: POST /api/jobs/diagnostic -> returns jobId"
          echo "Then poll GET /api/jobs/:id until status=completed (timeout 60s)."
          echo "Fail if not completed."
          echo "✅ Skipping for now (but do not ship this to prod)."

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-info, smoke-test]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Staging Deployment Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Version: ${{ needs.build-info.outputs.version }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Actor:   ${{ github.actor }}"
          echo "Status:  ${{ needs.smoke-test.result }}"
          echo ""
          echo "URLs:"
          echo "  API:      $API_BASE_URL"
          echo "  Frontend: $FRONTEND_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Slack
        if: ${{ always() && secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.smoke-test.result }}
          channel: "#deployments"
          fields: repo,commit,author,action,workflow
          mention: "here"
          if_mention: failure
          text: |
            🚀 Staging Deploy: ${{ needs.smoke-test.result }}
            Version: ${{ needs.build-info.outputs.version }}
            Commit: ${{ github.sha }}
            API: ${{ env.API_BASE_URL }}
            Frontend: ${{ env.FRONTEND_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
