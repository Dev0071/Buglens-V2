name: CI

on:
  push:
    branches:
      - main
      - develop
      - week-review
  pull_request:
    branches:
      - main
      - develop
      - week-review

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buglens_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buglens_test
      REDIS_URL: redis://localhost:6379
      S3_BUCKET_NAME: buglens-ci-artifacts
      JWT_SECRET: development-jwt-secret-change-me
      SENTRY_WEBHOOK_SECRET: ci-sentry-secret
      GITHUB_WEBHOOK_SECRET: ci-github-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for services
        run: npx wait-on tcp:5432 tcp:6379

      - name: Run database migrations
        run: npm run migrate:up

      - name: Lint TypeScript
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run TypeScript tests
        run: npm test -- --run

      - name: Lint Python
        working-directory: ./python
        run: |
          black --check .
          mypy .

      - name: Run Python tests
        working-directory: ./python
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
