# Deploy to Heroku Production
# Triggers on push to main branch with manual approval

name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency only)"
        required: false
        default: "false"
        type: boolean

jobs:
  # ============================================
  # Run Full Test Suite
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buglens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r python/requirements.txt

      - name: Run migrations
        run: npm run migrate:up
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test

      - name: Run all tests
        run: npm test -- --run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run frontend tests
        working-directory: ./web
        run: |
          npm ci
          npm test -- --run

  # ============================================
  # Approval Gate
  # ============================================
  approve:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment: production

    steps:
      - name: Approval Checkpoint
        run: |
          echo "✅ Production deployment approved"
          echo "Deploying commit: ${{ github.sha }}"

  # ============================================
  # Deploy API to Production
  # ============================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: approve
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_PROD_API }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          buildpack: https://github.com/heroku/heroku-buildpack-nodejs

      - name: Wait for Deployment
        run: sleep 45

      - name: Health Check
        id: health
        run: |
          API_URL="https://${{ secrets.HEROKU_APP_PROD_API }}.herokuapp.com"

          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ API health check passed"
              exit 0
            fi

            echo "Attempt $i: HTTP $HTTP_CODE, retrying..."
            sleep 10
          done

          echo "❌ Health check failed after 5 attempts"
          exit 1

  # ============================================
  # Deploy Worker to Production
  # ============================================
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: approve
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_PROD_WORKER }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          buildpack: https://github.com/heroku/heroku-buildpack-nodejs

      - name: Verify Worker Started
        run: |
          echo "Worker deployment complete"
          sleep 30
          echo "✅ Worker should be processing jobs"

  # ============================================
  # Production Verification
  # ============================================
  verify:
    name: Verify Production
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-worker]

    steps:
      - name: Run Production Checks
        run: |
          API_URL="https://${{ secrets.HEROKU_APP_PROD_API }}.herokuapp.com"

          echo "=== Production Verification ==="

          # Health endpoint
          echo "Checking health..."
          HEALTH=$(curl -s "$API_URL/health")
          echo "Response: $HEALTH"

          # Extract statuses
          STATUS=$(echo $HEALTH | jq -r '.status // "unknown"')
          DB=$(echo $HEALTH | jq -r '.database // "unknown"')
          REDIS=$(echo $HEALTH | jq -r '.redis // "unknown"')

          echo ""
          echo "Status: $STATUS"
          echo "Database: $DB"
          echo "Redis: $REDIS"

          if [ "$STATUS" = "ok" ] && [ "$DB" = "connected" ] && [ "$REDIS" = "connected" ]; then
            echo ""
            echo "✅ Production verification passed"
          else
            echo ""
            echo "⚠️ Some checks may need attention"
          fi

      - name: Create Sentry Release
        if: ${{ secrets.SENTRY_AUTH_TOKEN }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}
        continue-on-error: true

  # ============================================
  # Rollback on Failure
  # ============================================
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: verify
    if: failure()

    steps:
      - name: Rollback API
        run: |
          echo "⚠️ Deployment verification failed"
          echo "Manual rollback may be required"
          echo ""
          echo "To rollback, run:"
          echo "  heroku rollback -a ${{ secrets.HEROKU_APP_PROD_API }}"
          echo "  heroku rollback -a ${{ secrets.HEROKU_APP_PROD_WORKER }}"

          # Optionally auto-rollback (uncomment if desired)
          # curl -X POST "https://api.heroku.com/apps/${{ secrets.HEROKU_APP_PROD_API }}/releases" \
          #   -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"rollback": true}'

  # ============================================
  # Notify Team
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()

    steps:
      - name: Slack Notification
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.verify.result }}
          channel: "#deployments"
          fields: repo,commit,author,action,workflow
          mention: "here"
          if_mention: failure
          text: |
            Production deployment ${{ needs.verify.result == 'success' && '✅ successful' || '❌ failed' }}
            Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Log Summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Environment: production"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Status: ${{ needs.verify.result }}"
          echo ""
          echo "API: https://${{ secrets.HEROKU_APP_PROD_API }}.herokuapp.com"
