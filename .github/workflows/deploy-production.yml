name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency only)"
        required: false
        default: "false"
        type: boolean

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  API_BASE_URL: "https://api.buglens.co"
  FRONTEND_URL: "https://app.buglens.co"

jobs:
  # ============================================
  # Run Full Test Suite
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buglens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r python/requirements.txt

      - name: Run migrations
        run: npm run migrate:up
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test

      - name: Run all tests
        run: npm test -- --run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/buglens_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run frontend tests
        working-directory: ./web
        run: |
          npm ci
          npm test -- --run

  # ============================================
  # Approval Gate
  # ============================================
  approve:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment: production  # Requires a reviewer in GitHub environment settings

    steps:
      - name: Approval checkpoint
        run: |
          echo "✅ Production deployment approved"
          echo "Deploying commit: ${{ github.sha }}"

  # ============================================
  # Deploy to DigitalOcean App Platform
  # ============================================
  deploy:
    name: Deploy to DigitalOcean (Production)
    runs-on: ubuntu-latest
    needs: approve
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # First-time setup: create the app from the spec.
      - name: Create app if it doesn't exist
        run: |
          if ! doctl apps list --format "Spec.Name" --no-header | grep -q "^buglens-production$"; then
            echo "Creating production app..."
            doctl apps create --spec .do/app.production.yaml --wait
          else
            echo "App already exists, skipping create."
          fi

      - name: Get app ID
        id: app
        run: |
          APP_ID=$(doctl apps list --format "ID,Spec.Name" --no-header | grep "buglens-production" | awk '{print $1}')
          echo "id=$APP_ID" >> $GITHUB_OUTPUT

      - name: Deploy latest spec
        run: doctl apps update ${{ steps.app.outputs.id }} --spec .do/app.production.yaml --wait

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        id: health
        run: |
          echo "Checking $API_BASE_URL/api/v1/health"
          for i in {1..8}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$API_BASE_URL/api/v1/health" || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 8 attempts"
          exit 1

      - name: Assert health payload
        run: |
          HEALTH=$(curl -s "$API_BASE_URL/api/v1/health")
          echo "Health: $HEALTH"

          DB=$(echo "$HEALTH" | jq -r '.database // "unknown"')
          REDIS=$(echo "$HEALTH" | jq -r '.redis // "unknown"')

          [ "$DB" = "connected" ] || { echo "❌ DB: $DB"; exit 1; }
          [ "$REDIS" = "connected" ] || { echo "❌ Redis: $REDIS"; exit 1; }
          echo "✅ DB + Redis healthy"

  # ============================================
  # Create Sentry Release
  # ============================================
  sentry:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}
        continue-on-error: true

  # ============================================
  # Rollback hint on failure
  # ============================================
  rollback:
    name: Rollback hint
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Print rollback instructions
        run: |
          APP_ID=$(doctl apps list --format "ID,Spec.Name" --no-header | grep "buglens-production" | awk '{print $1}')
          echo "❌ Deployment failed. To roll back to the previous deployment:"
          echo ""
          echo "  doctl apps list-deployments $APP_ID"
          echo "  doctl apps create-deployment $APP_ID --force-rebuild"
          echo ""
          echo "Or roll back via the DigitalOcean console:"
          echo "  https://cloud.digitalocean.com/apps"

  # ============================================
  # Notify
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, sentry]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Print summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Production Deployment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "API:    ${{ env.API_BASE_URL }}"
          echo "Status: ${{ needs.deploy.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Slack notification
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result }}
          channel: "#deployments"
          fields: repo,commit,author,workflow
          mention: "here"
          if_mention: failure
          text: |
            Production deploy ${{ needs.deploy.result == 'success' && '✅' || '❌' }}: ${{ needs.deploy.result }}
            Commit: ${{ github.sha }}
            API: ${{ env.API_BASE_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
