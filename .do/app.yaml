# DigitalOcean App Platform Specification
# Staging Environment — minimum cost (~$12/mo)
#
# Uses external free-tier services instead of DO managed databases:
#   Postgres: https://neon.tech  (free tier, 512MB)
#   Redis:    https://upstash.com (free tier, 10K commands/day)
#
# Single service runs API + BullMQ workers in one container.

name: buglens-staging
region: nyc

features:
  - buildpack-stack=ubuntu-22

services:
  - name: api
    github:
      repo: Dev0071/Buglens-V2
      branch: staging
      deploy_on_push: true

    dockerfile_path: Dockerfile

    instance_count: 1
    instance_size_slug: professional-xs  # $12/mo — 1GB RAM, enough for API + workers + Python

    http_port: 3000

    routes:
      - path: /

    health_check:
      http_path: /api/v1/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      # Core
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info

      # URLs — update API_BASE_URL after DO gives you an app URL
      - key: API_BASE_URL
        value: https://api.staging.buglens.co
      - key: APP_BASE_URL
        value: https://staging.buglens.co
      - key: FRONTEND_URL
        value: https://staging.buglens.co
      - key: CORS_ORIGINS
        value: https://staging.buglens.co,http://localhost:5173

      # Database — paste your Neon connection string as a secret
      # Get it from: https://neon.tech → project → Connection Details → Connection string
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_SSL
        value: "true"

      # Redis — paste your Upstash connection string as a secret
      # Get it from: https://upstash.com → database → Details → REDIS_URL
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET

      # DO Spaces (S3-compatible) for source map / artifact cache
      # Create a Space at: https://cloud.digitalocean.com/spaces
      # Then generate a Spaces key at: https://cloud.digitalocean.com/account/api/spaces
      - key: S3_ENDPOINT
        value: https://nyc3.digitaloceanspaces.com
      - key: S3_BUCKET_NAME
        value: buglens-cache-staging
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET

      # GitHub App Integration
      - key: GITHUB_APP_ID
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_APP_NAME
        value: buglens-staging
      - key: GITHUB_APP_PRIVATE_KEY_SECRET_ID
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET

      # GitHub OAuth (social login)
      - key: GITHUB_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET

      # Google OAuth (social login)
      - key: GOOGLE_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET

      # OpenAI
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Sentry (optional for staging)
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_ENVIRONMENT
        value: staging

      # Slack (optional for staging)
      - key: SLACK_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: SLACK_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET

      # Auth
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET

      # Admin
      - key: PLATFORM_ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
